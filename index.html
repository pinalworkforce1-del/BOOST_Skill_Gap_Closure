<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOST Module 5 — Career Investment Conversation</title><style>html,body{height:100%;margin:0;background:#eef3f6;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}#app{width:100%;height:100%;border:0;display:block}.dock{position:fixed;z-index:20;left:16px;right:16px;bottom:14px;background:#102b46;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px #0005;display:none;align-items:center;justify-content:space-between;gap:12px}.dock.show{display:flex}.dock small{color:#dceaf4}.actions{display:flex;gap:8px;flex-wrap:wrap}.dock button,.dock a{border:0;border-radius:10px;background:#f0bd4e;color:#30270e;font-weight:900;padding:11px 15px;cursor:pointer;text-decoration:none}.dock a.secondary{background:#eef4f7;color:#173f61}.notice{position:fixed;z-index:21;top:12px;left:50%;transform:translateX(-50%);max-width:820px;width:calc(100% - 32px);background:#fff8e8;border:1px solid #e6cf94;border-radius:12px;padding:10px 13px;box-shadow:0 8px 25px #0002;display:none}.notice.show{display:block}@media(max-width:760px){.dock{flex-direction:column;align-items:flex-start}}</style></head><body><div id="notice" class="notice"></div><iframe id="app" src="pathway-progression-test.html" title="BOOST Module 5 Career Investment Conversation"></iframe><div id="dock" class="dock"><div><b id="dockTitle">Coaching outlook saved</b><br><small id="dockText">Your evidence is ready for the next conversation.</small></div><div class="actions"><a id="planner" class="secondary" href="legacy-planner.html" style="display:none">Open Full Training Planner</a><button id="returnBtn" style="display:none">Mark Complete & Return to BOOST</button></div></div><script>const KEY='pinal_boost_career_exploration_v1';const qs=new URLSearchParams(location.search);const ret=qs.get('boost_return'),mod=qs.get('boost_module'),nonce=qs.get('boost_nonce');const dock=document.getElementById('dock'),planner=document.getElementById('planner'),returnBtn=document.getElementById('returnBtn'),notice=document.getElementById('notice');function state(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){return null}}function validReturn(){if(!ret||!mod||!nonce)return null;try{const u=new URL(ret,location.href);return u.origin===location.origin?u:null}catch(_){return null}}function refresh(){const s=state(),route=s?.module4?.route;if(!s?.module4){notice.classList.add('show');notice.innerHTML='<b>BOOST needs your Module 4 decision evidence before beginning the Career Investment Conversation.</b>';return}else notice.classList.remove('show');const evaluated=!!s?.module5?.evaluatedAt;const readyNonBuild=route&&route!=='BUILD';if(evaluated||readyNonBuild){dock.classList.add('show');document.getElementById('dockTitle').textContent=route==='BUILD'?'Career investment outlook saved':'Next-step coaching direction saved';document.getElementById('dockText').textContent='Your career coach can review the evidence with you and determine next steps.';planner.style.display=route==='BUILD'?'inline-block':'none';returnBtn.style.display=validReturn()?'inline-block':'none'}else{dock.classList.remove('show')}}setInterval(refresh,700);window.addEventListener('storage',refresh);returnBtn.onclick=()=>{const u=validReturn();if(!u)return;u.searchParams.set('boost_complete',mod);u.searchParams.set('boost_nonce',nonce);location.href=u.toString()};refresh();</script></body></html>
